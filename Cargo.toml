[package]
name = "edit-portability-map"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Read-only Lightroom and XMP migration pre-flight inventory"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-photo-edit-portability-map"
readme = "README.md"
keywords = ["lightroom", "xmp", "photography", "migration", "cli"]
categories = ["command-line-utilities"]
include = ["/src/**", "/tests/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[[bin]]
name = "edit-portability-map"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
quick-xml = "0.38"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[package.metadata.docs.rs]
all-features = true
